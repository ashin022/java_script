<head>

<body>

    <input type="text" name="name" id="username">
    <script>
        //element.setattribut("attributname","valuue");//syntax
        let input1 = document.getElementById("username");
        input1.setAttribute("class","newclass");
        input1.setAttribute("name","newname");
